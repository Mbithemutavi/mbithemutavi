<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noimageai">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Illustrations | Mbithe Mutavi</title>
<meta name="description" content="Personal illustrations by Mbithe Mutavi, a Nairobi-based design consultant and visual storyteller.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

@font-face {
  font-family: 'More Sugar';
  src: url('more-sugar-regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:  #FFFFF8;
  --blue:   #0522FF;
  --lime:   #AAFF0C;
  --black:  #0A0A0A;
  --muted:  #888882;
  --border: rgba(10,10,10,0.09);
  --sans:   'Inter', sans-serif;
  --ms:     'More Sugar', serif;
}

html, body {
  min-height: 100vh;
  font-family: var(--sans);
  background: var(--cream);
  color: var(--black);
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 80vw 80vw at 110% -10%, rgba(5,34,255,0.09) 0%, transparent 60%),
    radial-gradient(ellipse 40vw 40vw at 95% 8%, rgba(170,255,12,0.13) 0%, transparent 55%),
    radial-gradient(ellipse 70vw 70vw at -15% 95%, rgba(5,34,255,0.07) 0%, transparent 60%);
  pointer-events: none;
}

/* ─── HEADER (same as testimonial page) ─── */
.site-logo {
  text-align: center;
  padding: 32px 24px;
  border-bottom: 1px solid var(--border);
}
.site-logo a { text-decoration: none; display: inline-block; }
.site-logo-img { height: 36px; width: auto; display: block; }

/* ─── INTRO ─── */
.intro {
  text-align: center;
  padding: 72px 32px 56px;
}
.intro-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 16px;
}
.intro h1 {
  font-family: var(--ms);
  font-weight: normal;
  font-size: clamp(40px, 7vw, 72px);
  line-height: 1.0;
  color: var(--black);
}
.intro p {
  font-size: 15px;
  line-height: 1.75;
  color: var(--muted);
  max-width: 460px;
  margin: 20px auto 0;
}

/* ─── GALLERY ─── */
.gallery {
  max-width: 1360px;
  margin: 0 auto;
  columns: 3 300px;
  column-gap: 20px;
  padding: 0 64px 96px;
}
.piece {
  break-inside: avoid;
  margin-bottom: 20px;
  display: block;
  width: 100%;
  min-height: 160px;
  background: rgba(10,10,10,0.04);
  overflow: hidden;
}
.piece img {
  width: 100%;
  display: block;
}

/* ─── FOOTER (same as testimonial page) ─── */
.page-footer {
  text-align: center;
  padding: 32px 24px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}
.page-footer a {
  color: var(--black);
  text-decoration: none;
  font-weight: 500;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 700px) {
  .intro { padding: 48px 24px 40px; }
  .gallery { padding: 0 24px 64px; columns: 1; }
}
</style>
</head>
<body>

<header class="site-logo">
  <a href="https://mbithemutavi.com">
    <img src="logo.png" alt="Mbithe Mutavi" class="site-logo-img">
  </a>
</header>

<section class="intro">
  <span class="intro-eyebrow">Sketchbook</span>
  <h1>Personal illustrations</h1>
  <p>Illustrations made outside client briefs.</p>
</section>

<main class="gallery" id="gallery" aria-label="Illustration gallery"></main>

<footer class="page-footer">
  <a href="https://mbithemutavi.com">← Back to portfolio</a>
</footer>

<script>
 
  var illustrations = [
    { src: "Images/Illustrations/Women_Read.jpg", alt: "woman reading newspaper" },
    { src: "Images/Illustrations/Untitled_Artwork.jpg", alt: "wangari maathai" },
    { src: "Images/Illustrations/Untitled_Artwork 8.jpg", alt: "fashion" },
    { src: "Images/Illustrations/Untitled_Artwork 7.jpg", alt: "incomplete gas station" },
    { src: "Images/Illustrations/Untitled_Artwork 4.jpg", alt: "wangari mathai" },
    { src: "Images/Illustrations/Untitled_Artwork 1.jpg", alt: "fashion coat of many colors" },
    { src: "Images/Illustrations/Night_Out.jpg", alt: "" },
    { src: "Images/Illustrations/Ngugi_Wa_Thiong'o_Family.jpg", alt: "" },
    { src: "Images/Illustrations/Julia_Dreams_Sketchbook_3_[Large].jpg", alt: "" },
    { src: "Images/Illustrations/Julia_Dreams_Sketchbook_1_[Large] 5.jpg", alt: "" },
    { src: "Images/Illustrations/Julia_Dreams_Sketchbook_1_[Large] 4.jpg", alt: "" },
    { src:"Images/Illustrations/IMG_1850.PNG", alt: "" },
    { src:"Images/Illustrations/IMG_1849.PNG", alt: "" },
    { src:"Images/Illustrations/IMG_1543.JPG"},
    { src:"Images/Illustrations/IMG_1523.JPG"},
    { src:"Images/Illustrations/IMG_1487.JPG"},
    { src:"Images/Illustrations/IMG_1475.PNG"},
    { src:"Images/Illustrations/IMG_0084.JPG"},
    { src:"Images/Illustrations/IMG_0077.JPG"},
    { src:"Images/Illustrations/Eyes_Have_It.jpg"},
    { src:"Images/Illustrations/Black_Girl.jpg"},
    { src:"Images/Illustrations/Avocado_.png"},
    { src:"Images/Illustrations/Anik.jpg"},

  ];

  var gallery = document.getElementById('gallery');

  illustrations.forEach(function (item) {
    var d = document.createElement('div');
    d.className = 'piece';
    var img = document.createElement('img');
    img.src = item.src;
    img.alt = item.alt || 'Illustration by Mbithe Mutavi';
    img.loading = 'lazy';
    img.onerror = function () { img.style.opacity = 0; };
    d.appendChild(img);
    gallery.appendChild(d);
  });
  gallery.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  img.draggable = false;
</script>

</body>
</html>
