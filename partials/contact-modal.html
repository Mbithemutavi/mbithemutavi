<div class="modal-overlay" id="contact-modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <h3 class="modal-title">Let's work together</h3>
    <p class="modal-sub">Tell me about your project — I'll be in touch within 2 business days.</p>
    <form class="form" id="contact-form" action="https://formspree.io/f/xqegqewd" method="POST">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
      <div class="form-row">
        <div class="form-group"><label>Name</label><input type="text" name="name" placeholder="Your name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="your@email.com" required></div>
      </div>
      <div class="form-group">
        <label>Project type</label>
        <select name="project">
          <option value="">What are you working on?</option>
          <option>Brand identity</option>
          <option>Editorial / Publication</option>
          <option>Illustration</option>
          <option>Web design</option>
          <option>Children's book</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tell me about your project</label>
        <textarea name="message" placeholder="What are you working on? What do you hope design will do for your mission?" required></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Send message</button>
      <div class="form-success" id="form-success">Sent! I'll be in touch within 2 business days.</div>
    </form>
  </div>
</div>
